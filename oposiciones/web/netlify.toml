# Tesón website (Astro). Netlify site settings: base directory = oposiciones/web
# The practice app is a separate Netlify site configured by the repo-root netlify.toml.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.5"

# tesonopos.com and www → tesonopos.es (primary)
[[redirects]]
  from = "https://tesonopos.com/*"
  to = "https://tesonopos.es/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.tesonopos.com/*"
  to = "https://tesonopos.es/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.tesonopos.es/*"
  to = "https://tesonopos.es/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
